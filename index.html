<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NovaStore | Premium Electronics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>NovaStore</h1>
        <div class="cart-pill">Cart: <span id="cartCount">0</span> items</div>
    </header>
    <div class="products-grid">
        <div class="card">
            <h3>Wireless Noise-Canceling Headphones</h3>
            <p>Premium 40mm drivers with 30-hour battery life.</p>
            <div class="price">$199.99</div>
            <button onclick="buy()">Add to Bag</button>
        </div>
        <div class="card">
            <h3>Mechanical Gaming Keyboard</h3>
            <p>RGB backlit tactile switches with aluminum top plate.</p>
            <div class="price">$89.50</div>
            <button onclick="buy()">Add to Bag</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
